#create a github action to build and push the server-dns docker image to the docker hub
name: HTTP response Server Image Build CI
on:
  push:
#    branches:
#    - master
    paths:
      - 'Dockerfile'
      - 'server.py'
env:
  DOCKER_USER: ${{secrets.DOCKER_USER}}
  DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
  REPO_NAME: http-status-code-server
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: docker login
      run: | # log into docker hub account
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
    - name: Get tag # latest or date of the build
      id: tag
      run: |
        if [ $GITHUB_REF == 'refs/heads/main' ] ; then
          echo "version=latest">> $GITHUB_OUTPUT
        else
          echo "version=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        fi
    - name: Build Router Docker image # push The image to the docker hub
      run: docker build . --tag $DOCKER_USER/$REPO_NAME:${{ steps.tag.outputs.version }}
    - name: Docker Push
      run: docker push $DOCKER_USER/$REPO_NAME:${{ steps.tag.outputs.version }}

